services:
  nutab:
    build:
      context: .
      args:
        - DATABASE_URL=${DATABASE_URL}
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Use the variable from the local .env file
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./public/uploads:/app/public/uploads
  nutab-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app

    ports:
      - "3001:3000"
      - "9229:9229"

    volumes:
      - .:/app
      - /app/node_modules
      - ./public/uploads:/app/public/uploads

    environment:
      - DATABASE_URL=${DATABASE_URL}

    command: sh -c "find . -name '@eaDir' -type d -prune -exec rm -rf {} + && npm install --silent && npx prisma generate && npm run dev"
    